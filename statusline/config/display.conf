# Display for budget-statusline.sh — which elements the statusline shows.
# This copy is yours: the installer never overwrites it. Check the result
# with:  budget-statusline.sh --display
#
#   hide NAME ...    hide the named elements (space or comma separated,
#                    case-insensitive). Lines accumulate. Hiding an element
#                    hides everything that hangs off it: "hide ctx" also
#                    hides cost and cache. Nothing else is configurable here;
#                    the rows and their order are fixed.
#
# The elements, with what each needs:
#
#   model     the model name (Opus)
#   effort    the effort level after the model (· high)               needs model
#   ctx       the context bar and its percentage (ctx:█████░░ 43%)
#   cost      the session cost after the context bar ($3.72)           needs ctx
#   cache     the prompt-cache cue (· cache 42m, · cache cold ↻38k)    needs ctx
#   day       the day bar with its spend and allowance (day:███░░ 64% $9.40/$15)
#   month     the month bar with its spend, limit and overage (month:██│█░ 36% $143/$400 +$50)
#   pace      the pace tick in the month bar (│)                       needs month
#   age       the stale-fetch tag after the budget bars (·12m)         needs day or month
#   repo      the whole repository row
#   path      the working directory (~/claude-budget-statusline)      needs repo
#   branch    the branch, with the repository name when the directory
#             is named differently (⎇  feature/preview)                needs repo
#   pending   uncommitted lines (· pending +16)                        needs branch
#   upstream  commits ahead of and behind upstream (↑1↓2)              needs branch
#   vs        lines changed against the default branch (· vs main +30) needs branch
#   session   lines Claude Code has edited this session (· session +118/-27)  needs repo
#
# Hiding both day and month also stops the usage fetch: no credentials are
# read and no request is made, so a statusline that only wants the
# repository row makes no network calls.
#
# Everything shows by default. To hide the pace tick and the cache cue:
# hide pace cache
