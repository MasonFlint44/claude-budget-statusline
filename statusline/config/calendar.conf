# Calendar for budget-statusline.sh — which days you work and which dates are
# holidays, so the daily allowance is spread over the days you actually work.
# This copy is yours: the installer never overwrites it. Add your own closures
# or PTO as "once" lines. Check the result with:  budget-statusline.sh --calendar
#
#   workdays DAYS    the days you work: a wrapping range (mon-fri, sun-thu), a
#                    list (mon,tue,wed,thu), a mix (mon-wed,fri) or "all".
#                    Default mon-fri. Last line wins, as with observe.
#   observe MODE [DOW=MODE ...]
#                    how a yearly holiday that falls on a day you don't work is
#                    observed. nearest = the nearest workday, ties go forward
#                    (US federal on a mon-fri week; the default). next / prev =
#                    always that way. none = no substitute day. DOW=MODE
#                    overrides one day. The substitute skips days that are
#                    already yearly holidays, so Christmas and Boxing Day
#                    chain, but not "once" days.
#                      observe nearest           US
#                      observe next              UK, Ireland, Australia, NZ, Canada
#                      observe next sat=none     Japan
#                      observe none              most of continental Europe
#   fixed MM-DD      name   yearly holiday on a fixed date
#   nth   N DOW MM   name   Nth weekday of the month (DOW = mon..sun)
#   last  DOW MM     name   last weekday of the month
#   once  YYYY-MM-DD[..YYYY-MM-DD] name
#                           a one-off date or inclusive range (PTO, closures).
#                           Never shifted; one on a day you don't work anyway
#                           has no effect.
#                    Names run to the end of the line; "#" starts a comment,
#                    so it cannot appear in a name. Keywords, day names and
#                    modes are case-insensitive.
#
# Shipped default: a Monday-to-Friday week with the United States federal
# holidays. Edit to match yours.
workdays mon-fri
observe nearest
fixed 01-01      New Year's Day
nth   3 mon 01   Birthday of Martin Luther King, Jr.
nth   3 mon 02   Washington's Birthday
last  mon 05     Memorial Day
fixed 06-19      Juneteenth National Independence Day
fixed 07-04      Independence Day
nth   1 mon 09   Labor Day
nth   2 mon 10   Columbus Day
fixed 11-11      Veterans Day
nth   4 thu 11   Thanksgiving Day
fixed 12-25      Christmas Day
