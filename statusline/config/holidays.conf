# Holiday calendar for budget-statusline.sh — days that are not workdays,
# so the daily allowance is not spread over them. This copy is yours: the
# installer never overwrites it. Add your own closures or PTO as "date" lines.
#
#   fixed MM-DD      name   fixed date, observed on Fri/Mon when it hits a weekend
#   nth   N DOW MM   name   Nth weekday of the month (DOW = mon..sun)
#   last  DOW MM     name   last weekday of the month
#   date  YYYY-MM-DD name   a one-off date
#                           Names run to the end of the line; "#" starts a comment,
#                           so it cannot appear in a name.
#   observe sat=<prev|next|none> sun=<prev|next|none>
#                           how a fixed date on a weekend is observed; next/prev
#                           = nearest working day that direction, skipping days
#                           already holidays. "observe none" = no shift. Applies
#                           to the whole file wherever the line sits.
#                           US federal: sat=prev sun=next. UK/AU/CA: sat=next
#                           sun=next. Japan: sat=none sun=next.
#
# Shipped default: the United States federal holidays. Edit to match yours.
observe sat=prev sun=next
fixed 01-01      New Year's Day
nth   3 mon 01   Birthday of Martin Luther King, Jr.
nth   3 mon 02   Washington's Birthday
last  mon 05     Memorial Day
fixed 06-19      Juneteenth National Independence Day
fixed 07-04      Independence Day
nth   1 mon 09   Labor Day
nth   2 mon 10   Columbus Day
fixed 11-11      Veterans Day
nth   4 thu 11   Thanksgiving Day
fixed 12-25      Christmas Day
