name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libfaketime and jq
        run: sudo apt-get update -q && sudo apt-get install -y -q libfaketime jq
      - name: Run the suite
        run: tests/run.sh -v
