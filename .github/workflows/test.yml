name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats, libfaketime, jq and the locale sources
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bats libfaketime jq locales shellcheck
      - name: shellcheck
        run: shellcheck statusline/spend-statusline.sh tests/skills/run.sh tests/skills/triggers.sh tests/bin/curl
      - name: Run the suite (DOCKER=1 adds the bash 3.2 / 4.3 / 4.4 checks)
        run: DOCKER=1 bats --print-output-on-failure tests/
